<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 370" width="888" height="370"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1C2B"/></marker></defs><text x="0" y="40" font-size="36" fill="#8A1C2B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">A부터 Z까지 떠먹이지 않아도 된다</text>
<rect x="0" y="70" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="24" y="120" font-size="38" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">백지 학생 (기존 랭커)</text>
<text x="24" y="166" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">"이건 액션, 저건 코미디"</text>
<text x="24" y="206" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">수많은 라벨로 일일이</text>
<text x="24" y="246" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">처음부터 가르쳐야 한다</text>
<rect x="468" y="70" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#8A1C2B" stroke-width="4"/>
<text x="492" y="120" font-size="38" fill="#8A1C2B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">똑똑한 학생 (Phase 1)</text>
<text x="492" y="166" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">언어·문맥·넷플릭스를</text>
<text x="492" y="206" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">이미 안다</text>
<text x="492" y="246" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">→ 40배 적은 라벨로 충분</text>
<text x="0" y="350" font-size="27" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">하나를 가르치면 열을 아는 기반 모델 덕에 Phase 2 가 가볍다</text></svg>