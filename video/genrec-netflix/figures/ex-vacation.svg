<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 410" width="888" height="410"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1C2B"/></marker></defs><text x="0" y="40" font-size="36" fill="#8A1C2B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">친구에게 휴가 이야기를 할 때</text>
<rect x="0" y="70" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="24" y="120" font-size="38" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">자잘한 기록 전부</text>
<text x="24" y="166" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">3시 2분 기상</text>
<text x="24" y="206" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">3시 10분 화장실</text>
<text x="24" y="246" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">3시 15분 물 마심</text>
<text x="24" y="286" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">… (친구가 도망간다)</text>
<rect x="468" y="70" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#8A1C2B" stroke-width="4"/>
<text x="492" y="120" font-size="38" fill="#8A1C2B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">하이라이트만</text>
<text x="492" y="166" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">비행기 연착, 최악</text>
<text x="492" y="206" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">도착해서 먹은 저녁은</text>
<text x="492" y="246" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">정말 환상적!</text>
<text x="0" y="350" font-size="27" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">넷플릭스도 같다: 5분 보다 만 영화·잡음 클릭은 버리고</text>
<text x="0" y="388" font-size="27" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">끝까지 본 드라마·좋아요만 문장으로 남긴다</text></svg>