<text x="24" y="460" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">가치 높은 참여는 크게, 바람직하지 않은 행동은 작게. RL(GRPO)보다 단순·저비용</text></svg>