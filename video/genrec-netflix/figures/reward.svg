<text x="24" y="258" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">장기 만족 대리 지표: 재방문·넓은 탐색·지속 참여 ↑</text>
