<text x="28" y="324" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">강한 신호만 남기고, 반복은 압축해 자연어 프롬프트로</text>
