<text x="28" y="112" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">시청·재생 시간·좋아요·찜, 기기·화면·지역·시간, 작품 메타데이터</text>
