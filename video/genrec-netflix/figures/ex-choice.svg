<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 400" width="888" height="400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1C2B"/></marker></defs><text x="0" y="40" font-size="36" fill="#8A1C2B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">객관식처럼 보기 안에서만 고르게</text>
<rect x="0" y="70" width="888" height="270" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="24" y="112" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">문제: 이 회원에게 다음으로 보여 줄 작품은?</text>
<circle cx="44" cy="150" r="14" fill="none" stroke="#B9B9B4" stroke-width="3"/>
<text x="72" y="159" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">① 〈드라마 A〉</text>
<circle cx="44" cy="194" r="14" fill="#8A1C2B" stroke="#8A1C2B" stroke-width="3"/>
<text x="72" y="203" font-size="26" fill="#8A1C2B" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">② 〈영화 B〉   ← 카탈로그 안에서 점수가 가장 높은 작품</text>
<circle cx="44" cy="238" r="14" fill="none" stroke="#B9B9B4" stroke-width="3"/>
<text x="72" y="247" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">③ 〈영화 C〉</text>
<circle cx="44" cy="282" r="14" fill="none" stroke="#B9B9B4" stroke-width="3"/>
<text x="72" y="291" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">④ 〈다큐 D〉</text>
<text x="0" y="380" font-size="27" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">주관식(자유 생성)이 아니라서 보기에 없는 작품은 답이 될 수 없다</text></svg>