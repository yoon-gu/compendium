<text x="0" y="420" font-size="27" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">무거운 공사는 드물게, 가벼운 공사는 자주 — 지능은 그대로, 운영은 가볍게</text></svg>