<text x="24" y="416" font-size="30" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">〈영화 B〉에 좋아요를 눌렀다.”</text>
<text x="24" y="456" font-size="25" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">짧게 보다 만 C 와 조회만 한 D 는 뺀다 · 8편 → ‘정주행’ 하나로 압축</text></svg>