<text x="16" y="90" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">10/05  재생  〈드라마 A〉 1-8화 전부, 각 40분+</text>
