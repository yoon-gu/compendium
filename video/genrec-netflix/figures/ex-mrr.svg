<text x="0" y="420" font-size="27" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">여러 요청의 역순위를 평균 → MRR. 1에 가까울수록 좋다</text></svg>