<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 664" width="888" height="664"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0472D"/></marker></defs><text x="0" y="40" font-size="36" fill="#B0472D" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">에이전트 네이티브 (agent-native) 회사</text><rect x="0" y="70" width="888" height="160" rx="14" fill="#FFFFFF" stroke="#B0472D" stroke-width="4"/>
<text x="26" y="126" font-size="36" fill="#B0472D" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">사람: 무엇을 맡길지 정한다</text>
<text x="26" y="178" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">풀 문제를 고르고, 시간과 토큰을 어디에 쓸지 배분</text>
<line x1="444.0" y1="234" x2="444.0" y2="278" stroke="#B0472D" stroke-width="4" marker-end="url(#a)"/>
<rect x="0" y="282" width="888" height="160" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="26" y="338" font-size="36" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">코딩 에이전트 여럿</text>
<text x="26" y="390" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">코드는 에이전트가 쓴다 · 손으로 쓰는 코드는 0줄</text>
<line x1="444.0" y1="446" x2="444.0" y2="490" stroke="#B0472D" stroke-width="4" marker-end="url(#a)"/>
<rect x="0" y="494" width="888" height="160" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="26" y="550" font-size="36" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif">결과를 보고 다음 문제로</text>
<text x="26" y="602" font-size="30" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif">무엇이 통했는지 판단해 다시 배분</text></svg>