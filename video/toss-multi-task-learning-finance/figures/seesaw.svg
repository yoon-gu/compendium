<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 610" width="888" height="610"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F7A66"/></marker></defs><text x="444" y="40" font-size="34" fill="#141414" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">공유층을 거치는 한</text>
<text x="444" y="90" font-size="28" fill="#6B6B68" text-anchor="middle" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">한 과제를 위한 변경이 다른 과제를 해칠 수 있다</text>
<polygon points="444,318 400,392 488,392" fill="#6B6B68"/>
<line x1="84" y1="370" x2="804" y2="266" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
<rect x="34" y="254" width="240" height="96" rx="16" fill="#EAF3EE" stroke="#4E8F76" stroke-width="3"/>
<text x="154" y="314" font-size="34" fill="#4E8F76" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">과제 A ↑</text>
<rect x="614" y="150" width="240" height="96" rx="16" fill="#F6E7E5" stroke="#C0605A" stroke-width="3"/>
<text x="734" y="210" font-size="34" fill="#C0605A" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">과제 B ↓</text>
<rect x="0" y="420" width="888" height="190" rx="16" fill="#E3EEEA" stroke="#3F7A66" stroke-width="3"/>
<text x="444" y="470" font-size="32" fill="#3F7A66" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">부정적 전이</text>
<text x="444" y="518" font-size="28" fill="#3F7A66" text-anchor="middle" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">PLE의 과제별 전문가와 게이트로 줄인다</text>
<text x="444" y="566" font-size="26" fill="#6B6B68" text-anchor="middle" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">손실은 과제마다 표준화, 손실 함수도 분포에 맞게</text></svg>