<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 520" width="888" height="520"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A2E3A"/></marker></defs><rect x="0" y="0" width="888" height="90" rx="14" fill="#FFFFFF" stroke="#7A2E3A" stroke-width="4"/>
<text x="28" y="40" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">1. 화면 테스트</text>
<text x="28" y="76" font-size="22" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">가치가 다 보이면 복제된다고 가정</text>
<rect x="0" y="104" width="888" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="28" y="144" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">2. 얻기 어려운 자리</text>
<text x="28" y="180" font-size="22" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">규제 틈새, 운영이 무거운 사업</text>
<rect x="0" y="208" width="888" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="28" y="248" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">3. 클라이언트는 오픈소스</text>
<text x="28" y="284" font-size="22" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">데이터·컴플라이언스·서비스는 지킨다</text>
<rect x="0" y="312" width="888" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="28" y="352" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">4. 과금 다시 보기</text>
<text x="28" y="388" font-size="22" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">좌석 → 끝낸 일, 회수한 돈</text>
<rect x="0" y="416" width="888" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="28" y="456" font-size="28" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">5. 유통이 먼저</text>
<text x="28" y="492" font-size="22" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">좁은 시장의 깊은 신뢰</text></svg>