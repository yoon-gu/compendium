<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 548" width="888" height="548"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F5F7A"/></marker></defs><rect x="0" y="0" width="888" height="148" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="26" y="54" font-size="34" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">① 하니스가 도구 정의를 건넨다</text>
<text x="26" y="106" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">이름·설명·인자 형식이 매 요청마다 실린다</text>
<line x1="444.0" y1="152" x2="444.0" y2="196" stroke="#1F5F7A" stroke-width="4" marker-end="url(#a)"/>
<rect x="0" y="200" width="888" height="148" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="26" y="254" font-size="34" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">② 모델이 호출을 요청한다</text>
<text x="26" y="306" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">예: 이슈 목록 도구를 state=open 으로</text>
<line x1="444.0" y1="352" x2="444.0" y2="396" stroke="#1F5F7A" stroke-width="4" marker-end="url(#a)"/>
<rect x="0" y="400" width="888" height="148" rx="14" fill="#FFFFFF" stroke="#1F5F7A" stroke-width="4"/>
<text x="26" y="454" font-size="34" fill="#1F5F7A" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">③ 하니스가 실행하고 결과를 돌려준다</text>
<text x="26" y="506" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">결과는 컨텍스트에 쌓이고, 모델이 다음을 정한다</text></svg>