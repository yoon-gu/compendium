<text x="0" y="350" font-size="28" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">→ 원문: “하루 600PB가 넘는 git 트래픽”</text></svg>