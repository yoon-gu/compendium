<text x="75" y="460" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">2주 뒤</text>
<rect x="164" y="390" width="724" height="116" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="184" y="438" font-size="22" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">발급 → 첫 이용 → 해외 결제 이용액</text>
<text x="184" y="480" font-size="21" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">표본이 작으면 작다고 적는다</text></svg>