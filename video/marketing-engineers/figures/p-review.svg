<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 400" width="888" height="400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B4C7E"/></marker></defs><text x="0" y="34" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">크리에이티브 에이전트가 문구를 만들면</text>
<rect x="0" y="60" width="420" height="220" rx="14" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="4"/>
<text x="26" y="114" font-size="34" fill="#2B4C7E" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">심의 통과 문구 조합</text>
<text x="26" y="166" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">이미 심의를 거친 조각만</text>
<text x="26" y="216" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">→ 빠르게 내보낸다</text>
<rect x="468" y="60" width="420" height="220" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="494" y="114" font-size="34" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">새 표현</text>
<text x="494" y="166" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">심의 대기열로</text>
<text x="494" y="216" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">준법감시인 내부 심의</text>
<text x="494" y="266" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">업권 따라 협회 심의</text>
<text x="0" y="340" font-size="24" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">금융소비자보호법: 광고 전 내부 심의</text>
<text x="0" y="382" font-size="26" fill="#2B4C7E" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">원문의 승인 대기열이 카드사에서는 심의 대기열</text></svg>