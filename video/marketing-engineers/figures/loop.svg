<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 530" width="888" height="530"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B4C7E"/></marker></defs><rect x="0" y="0" width="140" height="90" rx="14" fill="#2B4C7E" stroke="#2B4C7E" stroke-width="0"/>
<text x="70" y="56" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">월</text>
<rect x="156" y="0" width="732" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="180" y="56" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">성과 메모 읽고 유지·중단·변경</text>
<rect x="0" y="104" width="140" height="90" rx="14" fill="#2B4C7E" stroke="#2B4C7E" stroke-width="0"/>
<text x="70" y="160" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">화·수</text>
<rect x="156" y="104" width="732" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="180" y="160" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">만들고, 약했던 워크플로 고치고, 새 시험</text>
<rect x="0" y="208" width="140" height="90" rx="14" fill="#2B4C7E" stroke="#2B4C7E" stroke-width="0"/>
<text x="70" y="264" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">목</text>
<rect x="156" y="208" width="732" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="180" y="264" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">영업·고객 지원 통화에 들어간다</text>
<rect x="0" y="312" width="140" height="90" rx="14" fill="#2B4C7E" stroke="#2B4C7E" stroke-width="0"/>
<text x="70" y="368" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">금</text>
<rect x="156" y="312" width="732" height="90" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="180" y="368" font-size="26" fill="#141414" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">에이전트가 만든 것 검토, 파일 고치기</text>
<text x="0" y="470" font-size="26" fill="#A23B3B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">하루 종일 결과물을 고치고 있다면? 문제는 위쪽</text>
<text x="0" y="512" font-size="24" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">거의 언제나 두뇌 아니면 지시문</text></svg>