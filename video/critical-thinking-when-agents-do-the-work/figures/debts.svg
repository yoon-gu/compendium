<text x="864" y="212" font-size="22" fill="#6B6B68" text-anchor="end" font-weight="normal" opacity="1" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">마거릿앤 스토리</text>
<text x="24" y="264" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" opacity="1" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">팀이 공유하던 이해가 사라진다</text>
