<text x="0" y="260" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">실제로 비 온 날 8일 → 믿을 만하다</text>
<text x="0" y="360" font-size="28" fill="#A23B3B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">보정이 안 된 예보</text>
<circle cx="40" cy="430" r="30" fill="#A23B3B"/>
