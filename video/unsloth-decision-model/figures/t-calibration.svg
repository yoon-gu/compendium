<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 690" width="888" height="690"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A4B2A"/></marker></defs><text x="0" y="34" font-size="30" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">“비 올 확률 80%”라고 한 날 10일</text>
<text x="0" y="110" font-size="28" fill="#8A4B2A" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">보정이 잘 된 예보</text>
<circle cx="40" cy="180" r="30" fill="#8A4B2A"/>
<circle cx="124" cy="180" r="30" fill="#8A4B2A"/>
