<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 612" width="904" height="612"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F5D8A"/></marker></defs><rect x="0" y="0" width="904" height="612" rx="12" fill="#1B1D21" stroke="#B9B9B4" stroke-width="0"/>
<text x="18" y="50" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 51</text>
<text x="76" y="50" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">def execute_tool(name, args):</text>
<text x="18" y="82" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 52</text>
<text x="76" y="82" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">    try:</text>
<text x="18" y="114" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 53</text>
<text x="76" y="114" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        if name == "read_file":</text>
<text x="18" y="146" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 54</text>
<text x="76" y="146" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            return open(args["path"]).read()</text>
<text x="18" y="178" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 55</text>
<text x="76" y="178" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        if name == "write_file":</text>
<text x="18" y="210" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 56</text>
<text x="76" y="210" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            with open(args["path"], "w") as f:</text>
<text x="18" y="242" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 57</text>
<text x="76" y="242" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">                f.write(args["content"])</text>
<text x="18" y="274" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 58</text>
<text x="76" y="274" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            return f"wrote {len(args['content'])} bytes to {args['path']</text>
<text x="76" y="306" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        }"</text>
<text x="18" y="338" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 59</text>
<text x="76" y="338" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        if name == "run_command":</text>
<text x="18" y="370" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 60</text>
<text x="76" y="370" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            out = subprocess.run(args["command"], shell=True,</text>
<text x="18" y="402" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 61</text>
<text x="76" y="402" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">                                 capture_output=True, text=True, timeout</text>
<text x="76" y="434" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        =120)</text>
<text x="18" y="466" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 62</text>
<text x="76" y="466" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            return (out.stdout + out.stderr) or "(no output)"</text>
<text x="18" y="498" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 63</text>
<text x="76" y="498" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        return f"ERROR: unknown tool {name}"</text>
<text x="18" y="530" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 64</text>
<text x="76" y="530" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">    except Exception as e:</text>
<text x="18" y="562" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 65</text>
<text x="76" y="562" font-size="22" fill="#9CC7F5" text-anchor="start" font-weight="bold" font-family="NanumGothicCoding, monospace" xml:space="preserve">        return ""                                # 수업 5: 실패를 삼킨다 — 모델은 성</text>
<text x="76" y="594" font-size="22" fill="#9CC7F5" text-anchor="start" font-weight="bold" font-family="NanumGothicCoding, monospace" xml:space="preserve">        공한 줄 안다</text></svg>