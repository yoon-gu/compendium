<text x="22" y="318" font-size="25" fill="#A23B3B" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">Use background=true and you'll be notified.</text>
<text x="0" y="396" font-size="26" fill="#2F5D8A" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">좋은 길을 쉬운 길로 만드는 건 몸의 몫 (위 명령은 예시)</text></svg>