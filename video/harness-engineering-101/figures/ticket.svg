<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 606" width="904" height="606"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F5D8A"/></marker></defs><text x="0" y="30" font-size="25" fill="#6B6B68" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">실제로 부모가 쓴 일감의 첫머리</text>
<rect x="0" y="48" width="904" height="130" rx="10" fill="#1B1D21" stroke="#2F5D8A" stroke-width="0"/>
<text x="22" y="96" font-size="25" fill="#C3E88D" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">작업 디렉터리는 /private/tmp/he101/l8b 이다 (프로젝트</text>
<text x="22" y="140" font-size="25" fill="#C3E88D" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">루트, 이 경로 밖은 읽거나 수정하지 말 것). 이 안에 있는 …</text>
<g transform="translate(0,210)"><rect x="0" y="0" width="904" height="74" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="46.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">무엇을</text>
<text x="248" y="46.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">바깥으로 나가는 HTTP 호출을 모두 찾는다</text>
<rect x="0" y="84" width="904" height="74" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="130.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">어디서</text>
<text x="248" y="130.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">작업 디렉터리 = 프로젝트 루트</text>
<rect x="0" y="168" width="904" height="74" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="214.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">하지 말 것</text>
<text x="248" y="214.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">경로 밖 읽기·파일 수정</text>
<rect x="0" y="252" width="904" height="74" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="298.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">돌려줄 형식</text>
<text x="248" y="298.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">표 + 파일·줄 근거</text></g>
<text x="0" y="586" font-size="25" fill="#A23B3B" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">첫 시도엔 '어디서'가 빠져 자식이 홈 폴더를 뒤지기 시작했다</text></svg>