<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 350" width="904" height="350"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F5D8A"/></marker></defs><text x="18" y="32" font-size="25" fill="#6B6B68" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">30초 걸리는 테스트 앞에서</text>
<text x="358" y="32" font-size="25" fill="#6B6B68" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">그 결과</text>
<rect x="0" y="50" width="904" height="90" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="104.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">끝까지 기다린다</text>
<text x="358" y="104.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">그동안 아무것도 못 한다</text>
<rect x="0" y="150" width="904" height="90" rx="10" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="18" y="204.0" font-size="26" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">시간 제한으로 끊는다</text>
<text x="358" y="204.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">모델은 "여기선 실패한다"고 배운다</text>
<rect x="0" y="250" width="904" height="90" rx="10" fill="#E7EEF5" stroke="#2F5D8A" stroke-width="4"/>
<text x="18" y="304.0" font-size="26" fill="#2F5D8A" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">sleep 하고 확인, 또 확인</text>
<text x="358" y="304.0" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">비싼 뇌가 주방 타이머 노릇 (폴링)</text></svg>