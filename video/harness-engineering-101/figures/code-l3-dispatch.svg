<text x="18" y="50" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 43</text>
<text x="76" y="50" font-size="22" fill="#9CC7F5" text-anchor="start" font-weight="bold" font-family="NanumGothicCoding, monospace" xml:space="preserve">def execute_tool(name, args):                        # NEW: the dispatch</text>
<text x="18" y="82" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 44</text>
<text x="76" y="82" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">    """Map the model's JSON request to a real function call."""</text>
<text x="18" y="114" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 45</text>
<text x="76" y="114" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">    try:</text>
<text x="18" y="146" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 46</text>
<text x="76" y="146" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        if name == "read_file":</text>
<text x="18" y="178" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 47</text>
<text x="76" y="178" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            return open(args["path"]).read()</text>
<text x="18" y="210" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 48</text>
<text x="76" y="210" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        if name == "run_command":</text>
<text x="18" y="242" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 49</text>
<text x="76" y="242" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            out = subprocess.run(args["command"], shell=True,</text>
<text x="18" y="274" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 50</text>
<text x="76" y="274" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">                                 capture_output=True, text=True, timeout</text>
<text x="76" y="306" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        =60)</text>
<text x="18" y="338" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 51</text>
<text x="76" y="338" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">            return out.stdout + out.stderr</text>
<text x="18" y="370" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 52</text>
<text x="76" y="370" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        return f"ERROR: unknown tool {name}"</text>
<text x="18" y="402" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 53</text>
<text x="76" y="402" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">    except Exception as e:</text>
<text x="18" y="434" font-size="20" fill="#6B6F76" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve"> 54</text>
<text x="76" y="434" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        return f"ERROR: {e}"                         # errors go BACK to</text>
<text x="76" y="466" font-size="22" fill="#E6E6E3" text-anchor="start" font-weight="normal" font-family="NanumGothicCoding, monospace" xml:space="preserve">        the model</text></svg>