<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 440" width="888" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C4A12"/></marker></defs><rect x="0" y="0" width="420" height="360" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="28" y="58" font-size="36" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">버리는 코드</text>
<text x="28" y="110" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">도구 호출, 일회용 스크립트</text>
<text x="28" y="160" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">모델만 읽는다</text>
<text x="28" y="210" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">빽빽해도 참을 만하다</text>
<rect x="468" y="0" width="420" height="360" rx="14" fill="#FFFFFF" stroke="#8C4A12" stroke-width="4"/>
<text x="496" y="58" font-size="36" fill="#8C4A12" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">커밋하는 코드</text>
<text x="496" y="110" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">테스트, 프로덕션 코드</text>
<text x="496" y="160" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">사람이 읽고 고친다</text>
<text x="496" y="210" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">모양이 곧 품질</text>
<line x1="444" y1="0" x2="444" y2="360" stroke="#8C4A12" stroke-width="6"/>
<text x="0" y="420" font-size="30" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">이 선을 긋지 않으면, 코드골프가 커밋이 된다</text></svg>