<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 480" width="888" height="480"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F6B4F"/></marker></defs><text x="0" y="34" font-size="27" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">노이즈 예측을 0.1 틀렸을 때 깨끗한 값 추정의 오차</text>
<rect x="0" y="64" width="888" height="160" rx="14" fill="#FFFFFF" stroke="#B9B9B4" stroke-width="3"/>
<text x="26" y="118" font-size="30" fill="#141414" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">노이즈가 절반쯤 걷힌 단계</text>
<text x="26" y="170" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">ᾱ = 0.25  →  √ᾱ = 0.5  →  배율 1.7</text>
<text x="860" y="190" font-size="56" fill="#141414" text-anchor="end" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">0.17</text>
<rect x="0" y="252" width="888" height="160" rx="14" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="4"/>
<text x="26" y="306" font-size="30" fill="#2F6B4F" text-anchor="start" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">노이즈가 거의 전부인 초반</text>
<text x="26" y="358" font-size="28" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">ᾱ = 0.0001  →  √ᾱ = 0.01  →  배율 100</text>
<text x="860" y="350" font-size="60" fill="#A23B3B" text-anchor="end" font-weight="bold" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">10</text>
<text x="860" y="392" font-size="22" fill="#A23B3B" text-anchor="end" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">표준편차 10배</text>
<text x="0" y="466" font-size="26" fill="#6B6B68" text-anchor="start" font-weight="normal" font-family="NanumGothic, Nanum Gothic, sans-serif" xml:space="preserve">배율 = √(1 − ᾱ) ÷ √ᾱ   (예시 값으로 계산)</text></svg>